name: CI

on:
  push:
    branches: [ "I/next" ]
  pull_request:
    branches: [ "I/next" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Mono
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-complete

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore PPWCode.Vernacular.Contracts.sln -p:Configuration=Release

    - name: Build
      run: dotnet build PPWCode.Vernacular.Contracts.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

    - name: Test
      run: |
        dotnet test PPWCode.Vernacular.Contracts.sln \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: '**/test-results.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Code Coverage Report
      uses: 5monkeys/cobertura-action@master
      if: always()
      with:
        path: 'coverage/**/coverage.cobertura.xml'
        minimum_coverage: 0
        fail_below_threshold: false
        show_line: true
        show_branch: true
        show_missing: true
        link_missing_lines: true
        report_name: Code Coverage
